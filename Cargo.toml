[package]
name = "echoro-backend"
version = "0.1.0"
edition = "2021"

[workspace]
members = [".", "entity", "migration"]

[dependencies]
actix-multipart = "0.7.2"
actix-web = "4"
derive_more = "2.0.1"
dotenv = "0.15.0"
entity = { version = "0.1.0", path = "entity" }
sea-orm = { version = "1.1.12", features = ["sqlx-postgres", "runtime-async-std-native-tls", "macros"] }
serde = { version = "1.0.219", features = ["derive"] }
futures-util = "0.3.31"
actix-cors = "0.7.1"
env_logger = "0.11.8"
log = "0.4.27"
serde_json = "1.0.140"
reqwest = {  version = "0.12.20", features = ["json"] }
solana-sdk = "3.0.0"
solana-client = "3.0.0"
solana-commitment-config = "3.0.0"
base64 = "0.22.1"
